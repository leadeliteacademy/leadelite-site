:root{--navy:#081A33;--navy2:#0E2648;--gold:#C8A34B;--gold2:#E2C77E;--bone:#F4EEE2}

.note{font-size:13px;opacity:.55;margin-top:12px}
.reel{width:100%;max-width:760px;margin-top:clamp(36px,6vh,56px)}
.reel .lbl{font-family:Oswald,sans-serif;letter-spacing:.24em;font-size:12px;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.player{position:relative;display:block;width:100%;aspect-ratio:16/9;border:1px solid rgba(200,163,75,.35);border-radius:14px;overflow:hidden;padding:0;background:#000;cursor:pointer}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;background:rgba(8,26,51,.72);border:2px solid var(--gold);display:grid;place-items:center;transition:transform .2s}
.player:hover .play{transform:scale(1.08)}
.play svg{width:30px;fill:var(--gold);margin-left:4px}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
footer{margin-top:40px;font-size:13px;opacity:.5}
footer a{color:inherit}
