<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pulse Results | Lead Elite Academy</title>
<link rel="icon" href="https://www.leadeliteacademy.com/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#081A33;--deep:#050F1F;--gold:#C8A34B;--gold-l:#D9BC77;--cream:#EFEAE1;--ink:#0E1B2E;--muted:#5A6577;--paper:#FBF9F5;--rule:#E3DCCD;
--fav:#1F6F54;--neu:#C9C2B3;--unf:#A3322A;--display:'Playfair Display',Georgia,serif;--imp:'Oswald','Arial Narrow',sans-serif;--body:'Source Sans 3','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--body)}
header{background:var(--navy);color:var(--cream);padding:calc(24px + env(safe-area-inset-top,0px)) 20px 26px;border-bottom:3px solid var(--gold)}
.wrap{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--imp);font-weight:500;letter-spacing:.06em;color:var(--gold-l)}
.mark{height:28px;width:auto}
h1{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.6rem);margin:16px 0 4px;color:#fff;line-height:1.1}
.sub{color:#D6D2C8;margin:0}
main{padding:10px 20px 60px}
h2{font-family:var(--display);color:var(--navy);font-size:1.5rem;margin:40px 0 6px}
.note{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.lock{max-width:420px;margin:50px auto;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:24px}
.lock input{width:100%;font:inherit;padding:11px 12px;border:1px solid #C9C2B3;border-radius:6px;margin:8px 0 12px}
button,.btn{font:600 1rem var(--imp);letter-spacing:.04em;background:var(--gold);color:var(--deep);border:0;border-radius:6px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
input:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--unf);font-weight:600}
.hero{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:20px;margin-top:24px;align-items:stretch}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.big{background:var(--navy);color:#fff;border-radius:10px;padding:24px}
.big .n{font-family:var(--display);font-size:4rem;line-height:1;color:var(--gold-l)}
.big p{margin:8px 0 0;color:#D6D2C8}
.pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:720px){.pillars{grid-template-columns:repeat(2,1fr)}}
.pl{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:16px 14px}
.pl .name{font-weight:600}
.pl .pct{font-family:var(--display);font-size:2rem;color:var(--navy);line-height:1.1;margin-top:6px}
.pl .s{color:var(--muted);font-size:.85rem}
.pl.low{border-color:var(--unf)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee;margin-top:8px}
.stack i{display:block;height:100%}
.f{background:var(--fav)}.u{background:var(--unf)}.m{background:var(--neu)}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.95rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;background:#F4F0E8;white-space:nowrap}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
td .stack{width:140px}
.tag{font-family:var(--imp);font-size:.8rem;color:var(--gold);letter-spacing:.04em}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.88rem;margin:6px 0 12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.quotes{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:6px 18px;max-height:520px;overflow:auto}
.quotes p{margin:12px 0;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.quotes p:last-child{border:0}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.ghost{background:transparent;border:1px solid var(--navy);color:var(--navy)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><svg class="mark" viewBox="-60.8 -1 121.6 289.1" fill="#C8A34B" aria-hidden="true"><path d="M0.0,0.0L3.9,9.2L5.3,13.1L5.9,14.1L7.3,18.0L12.7,30.8L12.9,31.9L12.8,112.4L13.0,113.0L13.8,113.5L25.5,113.5L26.8,113.0L30.9,108.8L35.0,103.2L38.0,97.9L40.0,93.0L41.2,89.1L42.2,84.0L42.9,74.9L42.9,67.8L41.9,46.5L44.0,38.4L49.3,14.8L50.2,12.6L50.7,12.6L51.0,13.4L51.3,15.5L52.0,17.8L52.3,19.9L53.0,22.1L53.3,24.1L56.8,38.5L58.0,44.6L58.9,46.9L59.0,54.6L59.8,67.4L59.8,75.1L58.9,86.0L56.8,95.9L53.9,103.8L51.9,107.9L49.2,112.2L49.2,113.0L49.5,113.4L53.2,113.6L53.5,114.0L53.5,114.8L45.3,137.9L44.0,138.5L12.0,138.5L11.3,139.4L5.4,286.4L4.8,287.0L-4.8,287.1L4.8,287.1L-4.8,287.0L-5.4,286.4L-11.3,139.4L-12.0,138.5L-44.0,138.5L-45.3,137.9L-53.5,114.8L-53.5,114.0L-53.2,113.6L-49.5,113.4L-49.2,113.0L-49.2,112.2L-51.9,107.9L-53.9,103.8L-56.8,95.9L-58.9,86.0L-59.8,75.1L-59.8,67.4L-59.0,54.6L-58.9,46.9L-58.0,44.6L-56.8,38.5L-53.3,24.1L-53.0,22.1L-52.3,19.9L-52.0,17.8L-51.3,15.5L-51.0,13.4L-50.7,12.6L-50.2,12.6L-49.3,14.8L-44.0,38.4L-41.9,46.5L-42.9,67.8L-42.9,74.9L-42.2,84.0L-41.2,89.1L-40.0,93.0L-38.0,97.9L-35.0,103.2L-30.9,108.8L-26.8,113.0L-25.5,113.5L-13.8,113.5L-13.0,113.0L-12.8,112.4L-12.9,31.9L-12.7,30.8L-7.3,18.0L-5.9,14.1L-5.3,13.1L-3.9,9.2Z"/></svg><span>Lead Elite Academy</span></div>
  <h1 id="h">Leadership Pulse results</h1>
  <p class="sub" id="sub">Private. Enter your passcode to view.</p>
</div></header>
<main><div class="wrap" id="app">
  <form class="lock" id="lock"><label for="key"><b>Admin passcode</b></label>
  <input id="key" type="password" autocomplete="off" required>
  <label for="slug" class="note">Survey</label><input id="slug" type="text" value="sunrun" autocomplete="off">
  <button type="submit">View results</button><p class="err" id="err" hidden></p></form>
</div></main>
<script>
const SB='https://xhoeshbwsdogqebgdfhq.supabase.co', KEY='sb_publishable_8z-j3a-VtSTr2tf_jhnTzg_T4Qxu-Bd', MIN_GROUP=5;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(100*a/b):null;
const P=v=>v==null?'–':v+'%';
let DATA=null;
document.getElementById('lock').addEventListener('submit',async e=>{
  e.preventDefault(); const err=document.getElementById('err'); err.hidden=true;
  const btn=e.target.querySelector('button'); btn.disabled=true; btn.textContent='Checking…';
  try{
    const r=await fetch(SB+'/rest/v1/rpc/pulse_results',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_slug:document.getElementById('slug').value.trim(),p_key:document.getElementById('key').value.trim()})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d){err.textContent='That passcode or survey name doesn’t match. Check both and try again.';err.hidden=false;btn.disabled=false;btn.textContent='View results';return}
    DATA=d; render(d);
  }catch(x){err.textContent='Couldn’t reach the results. Check your connection and try again.';err.hidden=false;btn.disabled=false;btn.textContent='View results'}
});
function tally(rows,ids){let f=0,m=0,u=0,n=0,sum=0;for(const r of rows)for(const id of ids){const v=r.answers[id];if(v==null)continue;n++;sum+=v;if(v>=4)f++;else if(v===3)m++;else u++}
  return{n,f:pct(f,n),m:pct(m,n),u:pct(u,n),avg:n?(sum/n).toFixed(2):null}}
const bar=t=>t.n?'<div class="stack" aria-hidden="true"><i class="f" style="width:'+t.f+'%"></i><i class="m" style="width:'+t.m+'%"></i><i class="u" style="width:'+t.u+'%"></i></div>':'';
function norm(s){return (s||'').trim().replace(/\s+/g,' ').toLowerCase()}
function groupTable(rows,key,label,info,pillarIds){
  const g=new Map(); for(const r of rows){const k=key==='region'?norm(r.region):(r.tenure||''); if(!k)continue; if(!g.has(k))g.set(k,{name:key==='region'?(r.region||'').trim():k,rows:[]}); g.get(k).rows.push(r)}
  const shown=[...g.values()].filter(x=>x.rows.length>=MIN_GROUP).sort((a,b)=>b.rows.length-a.rows.length);
  const small=[...g.values()].filter(x=>x.rows.length<MIN_GROUP).reduce((a,x)=>a+x.rows.length,0);
  const blank=rows.filter(r=>!(key==='region'?norm(r.region):r.tenure)).length;
  if(!shown.length)return '<p class="note">No '+label.toLowerCase()+' has '+MIN_GROUP+' or more responses yet, so none are shown on their own.'+(small?' '+small+' responses sit in smaller groups.':'')+'</p>';
  let h='<div class="table-wrap"><table><thead><tr><th>'+label+'</th><th>Responses</th><th>Overall</th>'+info.pillars.map(p=>'<th>'+esc(p.name)+'</th>').join('')+'</tr></thead><tbody>';
  for(const x of shown){h+='<tr><td>'+esc(x.name)+'</td><td class="num">'+x.rows.length+'</td><td class="num"><b>'+P(tally(x.rows,info.items.map(i=>i.id)).f)+'</b></td>'+info.pillars.map(p=>'<td class="num">'+P(tally(x.rows,pillarIds[p.code]).f)+'</td>').join('')+'</tr>'}
  h+='</tbody></table></div><p class="note" style="margin-top:8px">'+(small?small+' responses are in groups under '+MIN_GROUP+' and aren’t shown separately. ':'')+(blank?blank+' left this blank.':'')+'</p>';
  return h;
}
function render(d){
  const info=d.info, rows=d.responses||[], items=info.items, pillars=info.pillars;
  const pillarIds={}; pillars.forEach(p=>pillarIds[p.code]=items.filter(i=>i.pillar===p.code).map(i=>i.id));
  document.getElementById('h').textContent=d.company+' '+d.title;
  document.getElementById('sub').textContent=rows.length+' anonymous response'+(rows.length===1?'':'s')+(d.open?' so far. The survey is open.':'. The survey is closed.');
  const app=document.getElementById('app');
  if(!rows.length){app.innerHTML='<h2>No responses yet</h2><p class="note">Send the survey link and check back here. Results update every time you reload this page.</p>';return}
  const all=tally(rows,items.map(i=>i.id));
  const pt=pillars.map(p=>({...p,t:tally(rows,pillarIds[p.code])}));
  const lowest=Math.min(...pt.map(p=>p.t.f??101));
  let h='<div class="hero"><div class="big"><div class="n">'+P(all.f)+'</div><p>Favorable overall: share of all ratings that were a 4 or 5. Average rating '+all.avg+' of 5.</p></div><div class="pillars">'+
    pt.map(p=>'<div class="pl'+(p.t.f===lowest?' low':'')+'"><div class="name">'+esc(p.name)+'</div><div class="pct">'+P(p.t.f)+'</div><div class="s">'+P(p.t.u)+' unfavorable</div>'+bar(p.t)+'</div>').join('')+'</div></div>';
  h+='<div class="legend"><span style="--c:var(--fav)">Favorable (4–5)</span><span style="--c:var(--neu)">Neutral (3)</span><span style="--c:var(--unf)">Unfavorable (1–2)</span></div>';
  const its=items.map(i=>({...i,t:tally(rows,[i.id]),unseen:rows.filter(r=>r.answers[i.id]===null).length})).sort((a,b)=>(a.t.f??101)-(b.t.f??101));
  const pname=Object.fromEntries(pillars.map(p=>[p.code,p.name]));
  h+='<h2>Every statement, weakest first</h2><p class="note">Percentages leave out “Haven’t seen enough to say.”</p><div class="table-wrap"><table><thead><tr><th>Statement</th><th>Favorable</th><th>Neutral</th><th>Unfavorable</th><th></th><th>Avg</th><th>Not seen</th></tr></thead><tbody>'+
    its.map(i=>'<tr><td><span class="tag">'+esc(pname[i.pillar])+'</span><br>'+esc(i.text)+'</td><td class="num"><b>'+P(i.t.f)+'</b></td><td class="num">'+P(i.t.m)+'</td><td class="num">'+P(i.t.u)+'</td><td>'+bar(i.t)+'</td><td class="num">'+(i.t.avg??'–')+'</td><td class="num">'+i.unseen+'</td></tr>').join('')+'</tbody></table></div>';
  h+='<h2>By region</h2><p class="note">Favorable % by region. Only regions with '+MIN_GROUP+'+ responses are shown, so no one can be singled out. Regions are matched as typed, ignoring capitals and spacing.</p>'+groupTable(rows,'region','Region',info,pillarIds);
  h+='<h2>By time reporting to this leader</h2>'+groupTable(rows,'tenure','Time reporting',info,pillarIds);
  const keep=rows.map(r=>r.keep).filter(Boolean), start=rows.map(r=>r.start).filter(Boolean);
  const w=info.written||[];
  h+='<h2>In their words</h2><div class="cols"><div><p class="note"><b>'+esc((w[0]||{}).text||'Keep doing')+'</b> ('+keep.length+')</p><div class="quotes">'+(keep.map(s=>'<p>'+esc(s)+'</p>').join('')||'<p class="note">No answers yet.</p>')+'</div></div>'+
       '<div><p class="note"><b>'+esc((w[1]||{}).text||'Start doing')+'</b> ('+start.length+')</p><div class="quotes">'+(start.map(s=>'<p>'+esc(s)+'</p>').join('')||'<p class="note">No answers yet.</p>')+'</div></div></div>';
  h+='<div class="tools"><button type="button" id="csv">Download all responses (CSV)</button><button type="button" class="ghost" id="sum">Download summary (CSV)</button></div>';
  app.innerHTML=h;
  const dl=(name,lines)=>{const b=new Blob(['\ufeff'+lines.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  document.getElementById('csv').onclick=()=>dl('pulse-'+document.getElementById('h').textContent.toLowerCase().replace(/\W+/g,'-')+'-responses.csv',[['Date','Region','Time reporting',...items.map(i=>i.id+' '+i.text),'Keep doing','Start doing'],...rows.map(r=>[r.date,r.region,r.tenure,...items.map(i=>r.answers[i.id]??'not seen'),r.keep,r.start])]);
  document.getElementById('sum').onclick=()=>dl('pulse-summary.csv',[['Area','Statement','Favorable %','Neutral %','Unfavorable %','Average','Ratings','Not seen'],['Overall','All statements',all.f,all.m,all.u,all.avg,all.n,''],...pt.map(p=>[p.name,'All '+p.name+' statements',p.t.f,p.t.m,p.t.u,p.t.avg,p.t.n,'']),...its.map(i=>[pname[i.pillar],i.text,i.t.f,i.t.m,i.t.u,i.t.avg,i.t.n,i.unseen])]);
}
</script>
</body>
</html>
